name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Sujit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Sujit/requirements-core.txt
      - name: Install lightweight CI dependencies
        run: python -m pip install -r requirements-core.txt pytest ruff
      - name: Lint
        run: ruff check --select E4,E7,E9,F app/services/chunk_validator.py tests
      - name: Test
        run: python -m pytest -q tests
      - name: Compile
        run: python -m compileall -q app scripts

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: new predictionm/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: new predictionm/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: node --test tests/rendered-html.test.mjs
      - run: npm run build
